<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 50% 30%,#1a1a2e,#08080c 70%);color:#eaeaf2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:480px;text-align:center;background:rgba(20,20,28,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:50px 32px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.icon{font-size:80px;margin-bottom:20px;animation:lock 3s ease-in-out infinite}
@keyframes lock{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
h1{font-size:1.4rem;font-weight:800;color:#f87171;margin-bottom:14px}
p{color:#6b6b85;font-size:.88rem;line-height:1.7;margin-bottom:10px}
.warn{background:rgba(239,68,68,.08);border-left:3px solid #ef4444;padding:14px 16px;border-radius:8px;text-align:left;font-size:.82rem;color:#a0a0b0;margin-top:20px;line-height:1.6}
.warn b{color:#f87171}
.foot{margin-top:24px;font-size:.7rem;color:#4a4a5a}
</style>
</head>
<body>
<div class="box">
<div class="icon">&#128274;</div>
<h1>Script da duoc bao ve</h1>
<p>Noi dung khong the xem truc tiep qua trinh duyet.</p>
<p>Chi executor Roblox nhu Delta X moi load duoc.</p>
<div class="warn">
<b>Canh bao:</b> Moi hanh vi co gang sao chep, chinh sua hoac phan phoi lai script nay deu bi nghiem cam.
</div>
<div class="foot">Lua Encoder Pro</div>
</div>
</body>
</html>
